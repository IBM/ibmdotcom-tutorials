[project]
name = "acp-beeai-ar-agent"
version = "0.1.0"
description = "A BeeAI agent server for ACP-based multi-agent songwriting and A&R critique."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "acp-sdk==1.0.1",
    "beeai-framework==0.1.29",
    "pydantic-ai==0.2.14",
    "python-dotenv==1.0.1"
]

[tool.uv]
constraint-dependencies = [
    "litellm>=1.84.0",          # CVE-2026-37004, CVE-2026-49468 (critical)
    "cryptography>=50.0.0",     # CVE-2026-69247 (high), CVE-2026-69249 (high)
    "anyio>=4.14.2",           # CVE-2026-63374 (critical), CVE-2026-64847 (medium)
    "mcp>=1.23.0",             # CVE-2025-66416 (high)
    "python-multipart>=0.0.31", # CVE-2026-53539 (high), CVE-2026-53540 (low)
    "starlette>=1.3.1",        # CVE-2025-62727, CVE-2026-54283 (high)
]
