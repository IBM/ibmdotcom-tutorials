[project]
name = "crewai-acp-music-agent-server"
version = "0.1.0"
description = "A CrewAI agent server for ACP-based multi-agent songwriting and Markdown reporting."
requires-python = ">=3.11, <4.0"
dependencies = [
    "acp-sdk==1.0.1",
    "crewai[tools]>=0.95.0",
    "agentops==0.4.19"
]

[tool.uv]
constraint-dependencies = [
    "litellm>=1.83.7",     # CVE-2026-37004 (critical)
    "crewai-tools>=1.15.1", # CVE-2026-62240 (high)
    "cryptography>=50.0.0", # CVE-2026-69247 (high), CVE-2026-69249 (high)
]

