[project]
name = "my_retail_advisor"
version = "0.1.0"
description = "my-retail-advisor using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=1.15.1,<2.0.0"
]

[project.scripts]
my_retail_advisor = "my_retail_advisor.main:run"
run_crew = "my_retail_advisor.main:run"
train = "my_retail_advisor.main:train"
replay = "my_retail_advisor.main:replay"
test = "my_retail_advisor.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
constraint-dependencies = [
    "litellm>=1.83.7",     # CVE-2026-37004 (critical)
    "cryptography>=50.0.0", # CVE-2026-69247 (high), CVE-2026-69249 (high)
]
