[tool.poetry]
name = "langgraph_react_agent"
version = "0.1.4"
description = "A template for a LangGraph LLM app deployable on IBM Cloud as an ai_service. This particular example focues on a WatsonX chatbot enhanced with external tools (function calling)."
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "langgraph_react_agent", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
langchain-ibm = ">=1.0.0"
python-dotenv = "^1.0.1"
ibm-watsonx-ai = ">=1.3.37"
langgraph = ">=1.0.10"
langchain-core = ">=1.3.3"
statsmodels = "^0.14.4"
numpy = "<2"
pytest = ">=9.0.3"  # Pin to safe version to avoid CVE in <9.0.3
ibm-cos-sdk = "^2.14.0"
botocore = "^1.37.17"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
