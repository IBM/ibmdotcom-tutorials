name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Check staged/committed files against baseline
        run: |
          # Use detect-secrets-hook so new unbaselined secrets cause a non-zero exit code
          git ls-files | grep -v -E '(\.lock$|package-lock\.json$|\.ipynb$|/node_modules/)' | xargs detect-secrets-hook --baseline .secrets.baseline
